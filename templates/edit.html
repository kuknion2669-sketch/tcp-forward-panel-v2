<!DOCTYPE html>
<html><head><meta charset=utf-8><title>编辑规则 — TCP 转发管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070b14;color:#e2e8f0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:0;min-height:100vh}
.topbar{background:#0d1225;border-bottom:1px solid #1e293b;padding:0 28px;height:56px;display:flex;align-items:center;gap:12px}
.brand-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.brand-text{font-size:15px;font-weight:600;letter-spacing:.3px}
.container{max-width:540px;margin:0 auto;padding:32px 28px}
h2{font-size:18px;font-weight:600;margin-bottom:24px}
h2 span{color:#3b82f6}
.card{background:#0d1225;border:1px solid #1e293b;border-radius:10px;padding:24px}
label{display:block;font-size:12px;color:#64748b;margin:14px 0 4px}
input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid #1e293b;background:#111827;color:#e2e8f0;font-size:14px;outline:none}
input:focus{border-color:#3b82f6}
.actions{display:flex;gap:12px;margin-top:24px}
.btn{padding:10px;border-radius:6px;border:none;font-size:14px;font-weight:500;cursor:pointer;flex:1;text-align:center;display:block}
.btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
.btn-ghost{background:transparent;color:#64748b;border:1px solid #1e293b;text-decoration:none}.btn-ghost:hover{border-color:#64748b;color:#e2e8f0}
</style>
</head><body>
<div class="topbar">
  <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px">
    <div class="brand-icon">⛭</div>
    <div class="brand-text">TCP 转发管理 <span style="color:#64748b;font-weight:400">· 编辑</span></div>
  </a>
</div>
<div class="container">
  <h2>编辑规则: <span>{{ item.name }}</span></h2>
  <div class="card">
  <form method="post">
    <label>备注名称</label><input name="name" value="{{ item.name }}" required>
    <label>本地端口</label><input name="local" value="{{ item.local }}" required>
    <label>目标 IP</label><input name="ip" value="{{ item.ip }}" required>
    <label>目标端口</label><input name="port" value="{{ item.port }}" required>
    <label>过期时间</label><input type="datetime-local" name="expire" value="{{ expire }}" style="color-scheme:dark">
    <label>流量配额 (GB)</label><input name="quota" value="{{ item.quota }}" step="0.5" min="0">
    <label>自定义分组</label><input name="group_name" value="{{ item.group_name }}" placeholder="留空自动识别">
    <label>备注</label><input name="note" value="{{ item.note }}" placeholder="备注信息">
    <div class="actions">
      <button class="btn btn-primary" type="submit">保存修改</button>
      <a class="btn btn-ghost" href="/">取消</a>
    </div>
  </form>
  </div>
</div>
</body></html>
