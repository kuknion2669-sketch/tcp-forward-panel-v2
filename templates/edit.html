<!DOCTYPE html>
<html><head><meta charset=utf-8><title>编辑规则</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0f172a;color:#f1f5f9;font-family:system-ui;padding:20px;min-height:100vh}
.container{max-width:520px;margin:0 auto}
.card{background:rgba(255,255,255,0.05);backdrop-filter:blur(12px);border-radius:24px;border:1px solid rgba(255,255,255,0.1);padding:24px}
h2{font-size:1.3rem;margin-bottom:20px}h2 span{color:#667eea;font-weight:700}
label{display:block;color:#94a3b8;font-size:.8rem;margin:14px 0 6px}
input{width:100%;padding:10px 14px;border-radius:40px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:#f1f5f9;font-size:.9rem;box-sizing:border-box}
input:focus{outline:none;border-color:#667eea}
.actions{display:flex;gap:12px;margin-top:24px}
.btn{background:#667eea;color:#fff;border:none;border-radius:40px;padding:12px;font-size:1rem;cursor:pointer;font-weight:600;flex:1;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn2{background:rgba(255,255,255,.08);color:#f1f5f9;border:none;border-radius:40px;padding:12px;font-size:1rem;text-decoration:none;text-align:center;display:block;flex:1}
</style></head><body><div class="container">
<div class="card">
<h2>编辑: <span>{{ item.name }}</span></h2>
<form method="post">
<label>备注名称</label><input name="name" value="{{ item.name }}" required>
<label>本地端口</label><input name="local" value="{{ item.local }}" required>
<label>目标IP</label><input name="ip" value="{{ item.ip }}" required>
<label>目标端口</label><input name="port" value="{{ item.port }}" required>
<label>过期时间</label><input type="datetime-local" name="expire" value="{{ expire }}" style="color-scheme:dark">
<label>流量配额(GB)</label><input name="quota" value="{{ item.quota }}" step="0.5" min="0" placeholder="0=不限量">
<label>自定义分组</label><input name="group_name" value="{{ item.group_name }}" placeholder="留空自动识别">
<label>备注</label><input name="note" value="{{ item.note }}" placeholder="备注信息">
<div class="actions">
<button class="btn" type="submit">保存修改</button>
<a class="btn2" href="/">取消</a>
</div>
</form>
</div></div></body></html>
