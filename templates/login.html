<!DOCTYPE html>
<html><head><meta charset=utf-8><title>登录 — TCP 转发管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:#070b14;color:#e2e8f0;
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;
  background-image:radial-gradient(ellipse at 50% 0%,rgba(59,130,246,.06) 0%,transparent 60%);
}
.login-card{
  background:#0d1225;border:1px solid #1e293b;border-radius:12px;
  padding:40px;width:380px;position:relative;z-index:1;
}
.login-logo{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,#3b82f6,#6366f1);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;color:#fff;font-weight:700;margin:0 auto 16px;
}
h2{text-align:center;font-size:16px;font-weight:600;margin-bottom:4px}
.sub{text-align:center;font-size:12px;color:#64748b;margin-bottom:28px}
label{display:block;font-size:12px;color:#64748b;margin-bottom:4px}
input{
  width:100%;padding:9px 14px;margin-bottom:16px;
  border-radius:6px;border:1px solid #1e293b;
  background:#111827;color:#e2e8f0;font-size:14px;outline:none
}
input:focus{border-color:#3b82f6}
button{
  width:100%;padding:10px;border-radius:6px;border:none;
  background:#3b82f6;color:#fff;font-size:14px;font-weight:500;cursor:pointer;margin-top:4px
}
button:hover{background:#2563eb}
.divider{border-top:1px solid #1e293b;margin-top:20px;padding-top:16px;text-align:center;font-size:11px;color:#475569}
.error{color:#ef4444;font-size:12px;text-align:center;margin-top:12px}
</style>
<script defer src="/static/three.min.js"></script>
<script defer src="/static/vanta.waves.min.js"></script>
</head><body>
<div class="login-card">
  <div class="login-logo">⛭</div>
  <h2>TCP 转发管理</h2>
  <div class="sub">请登录以继续</div>
  <form method=post>
    <label>账号</label><input name=username placeholder="输入账号" required>
    <label>密码</label><input name=password type=password placeholder="输入密码" required>
    <button type=submit>登 录</button>
    {% if error %}<div class=error>{{ error }}</div>{% endif %}
  </form>
  <div class="divider">初始账号: admin / admin123</div>
</div>
<div class="vanta-bg" id="vantaBg"></div>
<style>
.vanta-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
</style>
<script>
(function(){
  function initVanta(){
    try{
      if(typeof THREE==='undefined'||typeof VANTA==='undefined'){setTimeout(initVanta,500);return}
      VANTA.WAVES({el:"#vantaBg",color:0x1a3a5c,color2:0x2a4a7c,waveHeight:20,shininess:30,zoom:0.85})
    }catch(e){console.warn('Vanta:',e.message)}
  }
  if(document.readyState==='complete') initVanta()
  else window.addEventListener('load',initVanta)
})()
</script>
</body></html>
