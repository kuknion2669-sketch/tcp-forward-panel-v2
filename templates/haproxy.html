<!DOCTYPE html>
<html><head><meta charset=utf-8><title>连接状态</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0f172a;color:#f1f5f9;font-family:system-ui;padding:20px}
h2{color:#d0daf0;font-weight:400;margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:rgba(255,255,255,0.05);color:#94a3b8;padding:8px 10px;text-align:left;font-weight:600}
td{padding:6px 10px;border-bottom:1px solid rgba(255,255,255,0.04)}
td[data-port]{cursor:pointer;text-decoration:underline}
td[data-port]:hover{opacity:.8}
a{color:var(--cyan)}
</style><script defer src="/static/three.min.js"></script>
<script defer src="/static/vanta.waves.min.js"></script>
</head><body><h2>连接状态</h2>
<a href="/" style="display:inline-block;margin-bottom:16px;font-size:13px">&larr; 返回面板</a>
<table><tr><th>Status</th><th>节点</th><th>目标IP</th><th>连接数</th><th>入站</th><th>出站</th></tr>
{% for s in stats %}
{% set n = node_map.get(s.svname.lstrip('s')) %}
<tr>
  <td style="color:{% if s.status=='UP' %}#0f0{% elif s.status=='DOWN' %}#f22{% else %}#fb0{% endif %}">{{ s.status }}</td>
  <td>{{ n.name if n else s.svname }}</td>
  <td style="color:#8899bb">{{ n.ip if n else '' }}</td>
  <td data-port="{{ s.svname.lstrip('s') }}">{{ s.scur or 0 }}</td>
  <td>{{ s.bin or 0 }}</td>
  <td>{{ s.bout or 0 }}</td>
</tr>
{% endfor %}
</table>
<script>
document.addEventListener('click',function(e){
  var td=e.target.closest('td[data-port]');
  if(!td)return;
  var p=td.getAttribute('data-port');
  if(document.getElementById('c_'+p)){el.style.display=el.style.display==='none'?'':'none';return;}
  var el=document.createElement('div');
  el.id='c_'+p;el.style.cssText='padding:8px 12px;background:rgba(255,255,255,0.03);border-radius:6px;font-size:12px;color:#8899bb;margin:0 0 8px 24px';
  el.innerHTML='<span style=color:#94a3b8>Loading...</span>';
  td.closest('tr').parentNode.insertBefore(el,td.closest('tr').nextSibling);
  fetch('/api/connections').then(function(r){return r.json();}).then(function(d){
    if(!d.ok||!d.ports[p]){el.innerHTML='<span style=color:#94a3b8>No connections</span>';return;}
    var ips={};
    d.ports[p].forEach(function(x){var ip=x.remote.split(':')[0];if(x.state==='ESTABLISHED')ips[ip]=(ips[ip]||0)+1;});
    var ks=Object.keys(ips);
    if(!ks.length){el.innerHTML='<span style=color:#94a3b8>No established connections</span>';return;}
    var h='<div style=color:#a0aec0;font-weight:600;margin-bottom:4px>客户端IP:</div>';
    ks.sort().forEach(function(ip){h+='<div>'+ip+' <span style=color:#94a3b8>('+ips[ip]+'连接)</span></div>';});
    el.innerHTML=h;
  });
});
</script>
</body></html>
