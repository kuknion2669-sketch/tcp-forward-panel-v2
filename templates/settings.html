<!DOCTYPE html>
<html><head><meta charset=utf-8><title>设置 — TCP 转发管理</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070b14;color:#e2e8f0;font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;padding:0;min-height:100vh}
.topbar{background:#0d1225;border-bottom:1px solid #1e293b;padding:0 28px;height:56px;display:flex;align-items:center;gap:12px}
.brand-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#6366f1);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;font-weight:700}
.brand-text{font-size:15px;font-weight:600;letter-spacing:.3px}
.brand-text span{color:#64748b;font-weight:400}
a{color:#3b82f6;text-decoration:none}
.container{max-width:560px;margin:0 auto;padding:32px 28px}
h2{font-size:18px;font-weight:600;margin-bottom:24px}
.card{background:#0d1225;border:1px solid #1e293b;border-radius:10px;padding:24px;margin-bottom:20px}
label{font-size:12px;color:#64748b;display:block;margin:14px 0 4px}
input{width:100%;padding:8px 12px;border-radius:6px;border:1px solid #1e293b;background:#111827;color:#e2e8f0;font-size:14px;outline:none}
input:focus{border-color:#3b82f6}
.btn{padding:8px 24px;border-radius:6px;border:none;background:#3b82f6;color:#fff;font-size:14px;font-weight:500;cursor:pointer;margin-top:12px;display:inline-block}
.btn:hover{background:#2563eb}
.msg{color:#22c55e;font-size:13px;margin-top:8px}
.back{display:inline-block;margin-top:16px;font-size:13px;color:#64748b}
.back:hover{color:#e2e8f0}
</style>
</head><body>
<div class="topbar">
  <a href="/" style="text-decoration:none;color:inherit;display:flex;align-items:center;gap:12px">
    <div class="brand-icon">⛭</div>
    <div class="brand-text">TCP 转发管理 <span>· 设置</span></div>
  </a>
</div>
<div class="container">
  <h2>系统设置</h2>
  <form method=post>
  <div class="card">
    <label>管理端口</label><input name=panel_port_v2 value="{{ port }}">
    <label>登录账号</label><input name=username value="{{ username }}">
    <label>登录密码</label><input name=password type=password placeholder="新密码（留空不改）">
    <label>确认密码</label><input name=password2 type=password placeholder="再次输入">
  </div>
  <button class=btn type=submit>保存设置</button>
  {% if msg %}<div class=msg>{{ msg }}</div>{% endif %}
  </form>
  <a href="/" class="back">← 返回面板</a>
</div>
</body></html>
