<!DOCTYPE html>
<html><head><meta charset=utf-8><title>设置</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{background:#0f172a;
background-image:radial-gradient(ellipse at 50% 0%,rgba(0,229,255,.05) 0%,transparent 50%);background-attachment:fixed;color:#f1f5f9;font-family:system-ui;padding:20px;max-width:500px;margin:0 auto}
h2{color:#d0daf0;font-weight:400}.card{background:#1e293b;border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,.1);margin-bottom:16px}
label{font-size:13px;color:#94a3b8;display:block;margin-top:12px;margin-bottom:4px}
input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.3);color:#f1f5f9;font-size:14px;box-sizing:border-box;outline:none}
input:focus{border-color:#667eea}.btn{padding:8px 20px;border-radius:8px;border:none;background:#667eea;color:white;cursor:pointer;margin-top:12px;font-size:14px}
.msg{color:#6ee7b7;font-size:13px;margin-top:8px}a{color:#60a5fa;text-decoration:none;font-size:13px}
</style><script defer src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
</head><body>
<h2>设置</h2>
<form method=post>
<div class=card>
<h3 style="font-weight:400;margin:0 0 8px">端口与密码</h3>
<label>管理端口</label><input name=panel_port_v2 value="{{ port }}">
<label>登录账号</label><input name=username value="{{ username }}">
<label>登录密码</label><input name=password type=password placeholder="新密码(留空不改)">
<label>确认密码</label><input name=password2 type=password placeholder="再次输入">
</div>
<button class=btn type=submit>保存</button>
{% if msg %}<div class=msg>{{ msg }}</div>{% endif %}
</form>
<a href=/logout style="display:block;margin-top:12px;color:#f87171">退出登录</a>
</body></html>
